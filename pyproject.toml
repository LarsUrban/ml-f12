[project]
name = "ml-f12"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "larsurban", email = "lars.urban@cup.uni-muenchen.de" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[project.scripts]
ml-f12 = "ml_f12:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.5",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
